plugins {
    alias(libs.plugins.androidApplication)
}

android {
    namespace 'com.stringee.video_conference_sample'
    compileSdk 36

    defaultConfig {
        applicationId "com.stringee.video_conference_sample"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
        dataBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'], exclude: [])
    implementation libs.appcompat
    implementation libs.material
    implementation libs.core.splashscreen
    implementation libs.annotation
    implementation libs.core
    implementation libs.constraintlayout
    implementation libs.lifecycle.livedata.ktx
    implementation libs.lifecycle.viewmodel.ktx
    implementation libs.flexbox
    implementation libs.circleindicator
    implementation libs.stringee.android.sdk
    implementation libs.android
    testImplementation libs.junit
}

ext.coverageCoreIncludes = [
        '**/ConferenceInputPolicy*.class',
        '**/ConnectionTokenState*.class'
]
apply from: rootProject.file('../gradle/coverage.gradle')
