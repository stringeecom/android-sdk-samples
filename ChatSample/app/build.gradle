apply plugin: 'com.android.application'

def mapsApiKey = providers.gradleProperty('MAPS_API_KEY')
        .orElse(providers.environmentVariable('MAPS_API_KEY'))
        .getOrElse('')

android {
    compileSdk 36
    defaultConfig {
        applicationId "com.stringee.stringeechatuikit"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 1
        versionName "sticker_icon_1.0"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        multiDexEnabled true
        manifestPlaceholders = [MAPS_API_KEY: mapsApiKey]
        resValue 'string', 'map_api_key', mapsApiKey
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/LICENSE.txt', 'META-INF/LICENSE', 'META-INF/NOTICE.txt', 'META-INF/NOTICE', 'META-INF/DEPENDENCIES.txt', 'META-INF/DEPENDENCIES']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    namespace 'com.stringee.stringeechatuikit'
}

repositories {
    maven {
        url "https://jitpack.io"
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.core:core:1.18.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation platform('com.google.firebase:firebase-bom:34.17.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation 'com.google.android.gms:play-services-maps:20.0.0'
    implementation 'com.google.android.gms:play-services-location:21.4.0'
    implementation 'com.nostra13.universalimageloader:universal-image-loader:1.9.5'
    implementation('com.github.ozodrukh:CircularReveal:2.0.1@aar') {
        transitive = true
    }
    implementation 'com.github.MikeOrtiz:TouchImageView:3.6'
    implementation 'com.stringee.sdk.android:stringee-android-sdk:2.1.13'
    implementation 'io.github.webrtc-sdk:android:144.7559.09'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    testImplementation 'junit:junit:4.13.2'
}
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

ext.coverageCoreIncludes = [
        '**/ConnectionTokenState*.class'
]
apply from: rootProject.file('../gradle/coverage.gradle')
